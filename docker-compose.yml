services:
  collector:
    build: ./apps/api
    restart: unless-stopped
    env_file: .env
    volumes:
      # Only used in local-SQLite mode. Unused when TURSO_DATABASE_URL is set.
      - collector-data:/data
    # Dokploy: expose via its reverse proxy (Traefik). No ports needed there.
    # Local dev: uncomment to test.
    # ports:
    #   - "8080:8080"

volumes:
  collector-data:
