# Production shape: pulls CI-built images from GHCR.
# Built by .github/workflows/docker.yml on every push to main.
# Dokploy: Compose app on this file. Set TAG to pin a build (default: latest).
services:
  mailbag:
    image: ghcr.io/arunava-k/mailbag-api:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    volumes:
      # Only used in local-SQLite mode. Unused when TURSO_DATABASE_URL is set.
      - mailbag-data:/data

  dashboard:
    image: ghcr.io/arunava-k/mailbag-dashboard:${TAG:-latest}
    restart: unless-stopped

volumes:
  mailbag-data:
