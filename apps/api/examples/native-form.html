<!-- Native-style form: paste into any Cloudflare Pages site, style with your own CSS. -->
<form id="mb-form">
  <input type="email" name="email" required placeholder="you@example.com" />
  <!-- honeypot: keep hidden with CSS -->
  <input type="text" name="website" style="display:none" tabindex="-1" autocomplete="off" />
  <button type="submit">Subscribe</button>
  <p id="mb-msg"></p>
</form>
<script>
  const COLLECTOR = "https://collect.yourdomain.com";
  const LIST_KEY = "pk_REPLACE_ME";
  document.getElementById("mb-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const res = await fetch(COLLECTOR + "/v1/subscribe", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        list_key: LIST_KEY,
        email: fd.get("email"),
        website: fd.get("website"), // honeypot
        metadata: JSON.stringify({ source: location.pathname }),
      }),
    });
    const data = await res.json();
    document.getElementById("mb-msg").textContent =
      data.status === "pending" ? "Check your inbox to confirm." :
      data.status === "confirmed" ? "You're already subscribed." :
      (data.error || "Something went wrong.");
  });
</script>
