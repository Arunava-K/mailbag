# Mailbag dashboard: single-page static serve (state-based views, no deep links).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Static assets: cache hard, Vite fingerprints filenames.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Everything else serves the app shell (let the JS 404 unknown views).
  location / {
    expires 5m;
    try_files $uri $uri/ /index.html;
  }
}
