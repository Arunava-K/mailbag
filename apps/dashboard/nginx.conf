# Mailbag dashboard: single-page static serve (state-based views, no deep links).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API paths: proxy to the api service over the compose network. Used by the
  # local dev stack (VITE_MAILBAG_URL=/api) — in production the absolute API
  # URL is baked into the JS and these locations sit unused.
  location /api/ {
    proxy_pass http://mailbag:8080/; # trailing slash strips the /api/ prefix
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /v1/ {
    proxy_pass http://mailbag:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Static assets: cache hard, Vite fingerprints filenames.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Everything else serves the app shell (let the JS 404 unknown views).
  location / {
    expires 5m;
    try_files $uri $uri/ /index.html;
  }
}
