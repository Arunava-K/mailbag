# Mailbag dashboard: single-page app with real URLs (/contacts, /lists/:key/...).
# Unknown paths fall back to index.html so deep links and reloads work; the
# client router renders its own not-found page.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API paths: proxy to the api service over the compose network. Used by the
  # local dev stack (VITE_MAILBAG_URL=/api) — in production the absolute API
  # URL is baked into the JS and these locations sit unused.
  location /api/ {
    proxy_pass http://mailbag:8080/; # trailing slash strips the /api/ prefix
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /v1/ {
    proxy_pass http://mailbag:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Static assets: cache hard, Vite fingerprints filenames.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Build identity: never cached, so a deploy is verifiable immediately.
  location = /version.json {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # Real files (public/submit.html, favicon...) are served as-is; every other
  # path is an app route, so fall back to the shell. The locations above are
  # exact/prefix matches and win first, so /api/, /v1/, /assets/ and
  # /version.json never reach this fallback (a missing asset is a real 404).
  # index.html is revalidated on every load so a deploy is picked up at once;
  # hashed /assets/ files carry the long cache.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
