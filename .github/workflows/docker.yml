# Builds both service images and pushes to GHCR. Dokploy pulls these
# (docker-compose.yml references them by tag) — the VPS never builds.
name: docker

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/dashboard/**"
      - "VERSION"
      - "docker-compose.yml"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  # NOTE: GHCR paths must be lowercase (repo owner is Arunava-K).
  API_IMAGE: ghcr.io/arunava-k/mailbag-api
  DASH_IMAGE: ghcr.io/arunava-k/mailbag-dashboard
  PROD_API_URL: https://mailbag-api.steinerandco.space

jobs:
  api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: buildinfo
        run: |
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short
      - uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.buildinfo.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.buildinfo.outputs.time }}

  dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: buildinfo
        run: |
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.DASH_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short
      - uses: docker/build-push-action@v6
        with:
          context: ./apps/dashboard
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Baked into the JS at build time — production URL, fixed.
          build-args: |
            VITE_MAILBAG_URL=${{ env.PROD_API_URL }}
            VITE_APP_VERSION=${{ steps.buildinfo.outputs.version }}
            VITE_APP_COMMIT=${{ github.sha }}
            VITE_APP_BUILD_TIME=${{ steps.buildinfo.outputs.time }}
